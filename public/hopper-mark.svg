<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Hopper app icon (master, 1024x1024).
    Concept: stories pour into a hopper and come out as playback. Three poster tiles tumble
    into the hopper's mouth; the hopper body carries a negative-space play button; the spout
    glows where the picture comes out. One aurora gradient (teal > violet > rose) ties it together.
    Flat shapes only (LG icon guideline), depth from colour and overlap rather than effects.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1B1F4B"/>
      <stop offset="0.55" stop-color="#0E1030"/>
      <stop offset="1" stop-color="#07081A"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0.12" y1="0.05" x2="0.88" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#99F6E4"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F9A8D4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="tileC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBCFE8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: the launcher tile crops it, so it runs to every edge. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Soft halo behind the mark gives the dark field some depth. -->
  <circle cx="512" cy="560" r="420" fill="url(#halo)"/>

  <!-- Poster tiles tumbling into the mouth (back to front). -->
  <g>
    <rect x="300" y="196" width="150" height="214" rx="22" fill="url(#tileA)" transform="rotate(-16 375 303)"/>
    <rect x="575" y="176" width="150" height="214" rx="22" fill="url(#tileC)" transform="rotate(14 650 283)"/>
    <rect x="437" y="128" width="150" height="214" rx="22" fill="url(#tileB)" transform="rotate(-3 512 235)"/>
  </g>

  <!-- Hopper body: wide mouth tapering to a spout. -->
  <path d="M232 404H792a34 34 0 0 1 29 51L612 790v64a30 30 0 0 1-30 30H442a30 30 0 0 1-30-30v-64L203 455a34 34 0 0 1 29-51Z" fill="url(#aurora)"/>
  <!-- Mouth rim highlight: a thin bright lip so the tiles read as dropping *in*. -->
  <path d="M232 404H792a34 34 0 0 1 30 18H202a34 34 0 0 1 30-18Z" fill="url(#rim)"/>

  <!-- Negative-space play button, optically centred in the body. -->
  <path d="M470 500c0-16 17-26 31-18l122 72c14 8 14 28 0 36l-122 72c-14 8-31-2-31-18Z" fill="#0E1030"/>

  <!-- The picture coming out: a glow under the spout. -->
  <ellipse cx="512" cy="912" rx="150" ry="40" fill="url(#glow)"/>
</svg>
