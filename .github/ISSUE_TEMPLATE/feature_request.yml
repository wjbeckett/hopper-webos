name: Feature request
description: Suggest something Hopper should do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like Hopper to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: The problem it solves or what you can't do today.
    validations:
      required: true
  - type: dropdown
    id: reference
    attributes:
      label: Does an official Silo client already do this?
      description: Hopper follows the official Android TV client, so this helps a lot.
      options:
        - "Yes, Android TV"
        - "Yes, Apple TV"
        - "Yes, another client"
        - "No"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
    validations:
      required: false
